name: WTI Shadow Validation

on:
  workflow_dispatch:
  schedule:
    # Weekdays after the US session. GitHub cron uses UTC.
    - cron: "55 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: wti-shadow-validation
  cancel-in-progress: false

jobs:
  shadow-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml

      - name: Run frozen WTI shadow logger
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          WTI_EVENT_RISK: ${{ vars.WTI_EVENT_RISK }}
          WTI_EVENT_NOTE: ${{ vars.WTI_EVENT_NOTE }}
        run: |
          python wti_shadow_logger.py

      - name: Commit updated shadow log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add shadow_logs/wti_shadow_log.csv
          git add shadow_logs/wti_shadow_summary.csv

          if git diff --cached --quiet; then
            echo "No shadow-log changes to commit."
            exit 0
          fi

          git commit -m "chore: update WTI shadow validation"
          git push

