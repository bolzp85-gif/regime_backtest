name: Gold D1 V1 Dual-Output Shadow

on:
  workflow_dispatch:
  schedule:
    # Weekdays after the Gold futures daily bar should be safely available.
    # GitHub cron uses UTC.
    - cron: "45 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: gold-d1-v1-dual-output-shadow
  cancel-in-progress: false

jobs:
  gold-shadow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml

      - name: Run frozen Gold D1 V1 logger
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GOLD_EVENT_NOTE: ${{ vars.GOLD_EVENT_NOTE }}
        run: |
          python gold_dual_shadow_logger.py

      - name: Evaluate matured Gold D1 V1 outcomes
        run: |
          python gold_dual_shadow_evaluator.py

      - name: Commit updated Gold shadow data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add shadow_logs/gold_dual_shadow_log.csv
          git add shadow_logs/gold_dual_shadow_summary.csv
          git add shadow_logs/gold_dual_shadow_evaluation_summary.csv
          git add shadow_logs/gold_d1_time_blocks.csv
          git add shadow_logs/gold_v1_time_blocks.csv
          git add shadow_logs/gold_v1_phase_auc.csv
          git add shadow_logs/gold_dual_shadow_gate.csv
          git add shadow_logs/gold_dual_shadow_evaluation_history.csv
          git add shadow_logs/gold_dual_shadow_report.md

          if git diff --cached --quiet; then
            echo "No Gold shadow changes to commit."
            exit 0
          fi

          git commit -m "chore: update Gold D1 V1 future shadow"

          # Other scheduled shadow workflows may commit around the same time.
          # Rebase once before pushing to reduce harmless bot push conflicts.
          git pull --rebase origin main
          git push origin main
