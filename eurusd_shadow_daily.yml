name: EURUSD Shadow Validation

on:
  workflow_dispatch:
  schedule:
    # Weekdays after the FX/US session. GitHub cron uses UTC.
    # If Yahoo posts the daily bar later, the following run catches it.
    - cron: "58 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: eurusd-shadow-validation
  cancel-in-progress: false

jobs:
  eurusd-shadow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install lxml

      - name: Run frozen EURUSD A/B/E shadow logger
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EURUSD_EVENT_RISK: ${{ vars.EURUSD_EVENT_RISK }}
          EURUSD_EVENT_NOTE: ${{ vars.EURUSD_EVENT_NOTE }}
        run: |
          python eurusd_shadow_logger.py

      - name: Evaluate matured EURUSD shadow outcomes
        run: |
          python eurusd_shadow_evaluator.py

      - name: Commit updated EURUSD shadow data and evaluation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add shadow_logs/eurusd_shadow_log.csv
          git add shadow_logs/eurusd_shadow_summary.csv
          git add shadow_logs/eurusd_shadow_evaluation_summary.csv
          git add shadow_logs/eurusd_shadow_horizon_metrics.csv
          git add shadow_logs/eurusd_shadow_time_blocks.csv
          git add shadow_logs/eurusd_shadow_nonoverlap.csv
          git add shadow_logs/eurusd_shadow_gate.csv
          git add shadow_logs/eurusd_shadow_evaluation_history.csv
          git add shadow_logs/eurusd_shadow_report.md

          if git diff --cached --quiet; then
            echo "No EURUSD shadow changes to commit."
            exit 0
          fi

          git commit -m "chore: update EURUSD frozen shadow validation"
          git push
